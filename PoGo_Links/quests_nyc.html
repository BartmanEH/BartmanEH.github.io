<style>
  * { box-sizing: border-box; }
  /* Colours: Bart's VS Code palette (the early Claude code-block look): page #2b2b29, cards #33332f, borders #404040,
     text #d1d5db, bold #e5e5e5, grey #9ca3af. Keep the Pokémap quest Export page and the coord-link-page template in step. */
  /* Page width. BEFORE: full window width, so on a desktop the rows stretched and the pills sat far from the rest.
     WHY: Bart wants desktops to show the phone view. NOW (v7.35): at most 412px wide (Pixel 6 Pro), centred; phones are
     narrower, so nothing changes there. The bottom bar is capped to match. */
  html { background: #2b2b29; }
  body { max-width: 412px; box-sizing: border-box; margin: 0 auto; padding: 16px 16px 84px; background: #2b2b29; color: #d1d5db; font-family: -apple-system, system-ui, sans-serif; }
  /* v7.25: title and sub line share the first line; the three header buttons get their own row (they don't fit beside
     the title at phone width). */
  .top { margin: 0 0 8px; }
  h1 { display: inline; font-size: 18px; margin: 0 8px 0 0; color: #e5e5e5; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 12px; } /* spans the rows' width */
  /* GPX (download the track) and Map (open it in the GPX viewer): raised pill buttons with an icon, the same
     press-sinks-2px feel as the per-stop buttons. */
  .head { flex-wrap: wrap; }
  .hbtn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px 6px 10px; border-radius: 999px; font-size: 13px; font-weight: 800; letter-spacing: .3px; color: #fff; cursor: pointer; text-shadow: 0 1px 2px rgba(0,0,0,.45); transition: transform 90ms ease, box-shadow 90ms ease, filter 90ms ease; }
  .hbtn svg { width: 16px; height: 16px; flex: 0 0 16px; }
  .hbtn:hover { filter: brightness(1.08); }
  .hbtn:active { transform: translateY(2px); filter: brightness(.95); }
  #copyGpxBtn { background: linear-gradient(180deg, #9b7be8, #6f4fc4); border: 1px solid #cbb8ff; box-shadow: 0 3px 0 #6448c8, 0 6px 14px rgba(111,79,196,.35); }
  #copyGpxBtn:active { box-shadow: 0 1px 0 #6448c8, 0 2px 6px rgba(111,79,196,.3); }
  #gpxBtn { background: linear-gradient(180deg, #ffb547, #f08a12); border: 1px solid #ffd08a; box-shadow: 0 3px 0 #9a5506, 0 6px 14px rgba(240,138,18,.35); }
  #gpxBtn:active { box-shadow: 0 1px 0 #9a5506, 0 2px 6px rgba(240,138,18,.3); }
  #mapBtn { background: linear-gradient(180deg, #2fc4b2, #138f86); border: 1px solid #8ee8dd; box-shadow: 0 3px 0 #0b5d57, 0 6px 14px rgba(19,143,134,.35); }
  #mapBtn:active { box-shadow: 0 1px 0 #0b5d57, 0 2px 6px rgba(19,143,134,.3); }
  /* Home: back to the published list (absolute URL, so it also works from Drive/Solid Explorer copies). 2026-10-10. */
  /* 2026-10-10 BEFORE: dark slate pill with a cyan border. WHY: Bart: didn't match the other buttons. NOW: a bright
     filled sky-blue pill like them (cyan would clash with Map's teal); the Home marker's house badge stays the icon. */
  #homeBtn { text-decoration: none; background: linear-gradient(180deg, #3bb8f0, #1a86c8); border: 1px solid #a8e2fb; box-shadow: 0 3px 0 #1d6aa3, 0 6px 14px rgba(26,134,200,.35); }
  #homeBtn:active { box-shadow: 0 1px 0 #1d6aa3, 0 2px 6px rgba(26,134,200,.3); }
  .sub { display: inline; color: #9ca3af; font-size: 12.5px; }
  .toolbar { position: fixed; left: 0; right: 0; max-width: 412px; box-sizing: border-box; margin: 0 auto; bottom: 0; z-index: 10; background: #242422; border-top: 1px solid #404040; padding: 7px 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .toolbar button, .toolbar label { background: #353533; color: #d1d5db; border: 1px solid #404040; border-radius: 6px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
  #status { order: -1; flex: 1 0 100%; display: flex; justify-content: space-between; gap: 8px; font-weight: 600; color: #9ca3af; font-size: 13px; opacity: .85; padding-bottom: 2px; }
  /* Toggle switches (top of page): label | switch | label. The knob sits on the chosen side; the chosen label is
     bright and bold, the other dimmed. Tapping the switch or either label selects. */
  /* Each switch in its own card like the rows (Bart), both on one row at phone width: 13px labels, 40px switches. */
  .switches { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 6px; margin-bottom: 12px; } /* spans the rows' width */
  .toggle { display: inline-flex; align-items: center; gap: 5px; padding: 4px 6px; background: #33332f; border: 1px solid #404040; border-radius: 8px; user-select: none; -webkit-user-select: none; }
  .toggle .opt { font-size: 13px; color: #7d7d78; cursor: pointer; font-weight: 400; }
  .toggle .opt.on { color: #e5e5e5; font-weight: 700; }
  .toggle .sw { position: relative; width: 40px; height: 24px; border: 2px solid #d1d5db; border-radius: 13px; background: #2b2b29; cursor: pointer; padding: 0; flex: 0 0 auto; }
  .toggle .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #d1d5db; transition: transform 140ms ease; }
  .toggle .sw.right::after { transform: translateX(16px); }
  /* Two lines per stop: icon | one scrollable info line, then the buttons.
     BEFORE (to v7.25): 44x38 icon spanning both lines, distance pill at the start of line 1, as wide as its text.
     WHY: Bart wanted the pill at the right end of the button row, fixed width (like the coord-link-page pages); the icon
     column left too little room for it. v7.33: 32x28 icon beside line 1 only, button row full width. NOW (v7.34, Bart
     preferred the big icon): icon 52x56 spanning both lines again (left padding 3 px, gap 5 px), buttons beside it; it fits from 412 px (his Pixel 6 Pro
     and iPhone 13 Pro Max) because the teleport label is kerned 1 px tighter; narrower phones scroll. */
  .row { background: #33332f; border: 1px solid #404040; border-radius: 8px; padding: 6px 8px 6px 3px; margin-bottom: 6px; display: grid; grid-template-columns: 52px minmax(0, 1fr); column-gap: 5px; row-gap: 5px; align-items: center; }
  .row.done { opacity: 0.45; }
  .row .qicon { grid-row: 1 / span 2; width: 52px; height: 56px; object-fit: contain; }
  .row .noicon { grid-row: 1 / span 2; }
  /* Reward and task first so they are always visible; the rest (stop, distance, coordinates) scrolls sideways. */
  .row .line { white-space: nowrap; overflow-x: auto; scrollbar-width: none; font-size: 14px; color: #d1d5db; }
  .row .line::-webkit-scrollbar { display: none; }
  .row .line b { color: #e5e5e5; font-size: 15px; }
  .row .line .task { color: #e5e5e5; font-size: 15px; }
  /* v7.33: distance pill at the right end of the button row, one fixed width; long text tightens and shrinks to fit (fitPills). */
  .row .controls .dist { flex: 0 0 68px; width: 68px; box-sizing: border-box; margin-left: auto; padding: 0 3px; text-align: center; white-space: nowrap; overflow: hidden; background: #2b2b29; border: 1px solid #4a4a46; border-radius: 10px; font-size: 12px; line-height: 20px; font-weight: 700; color: #ffd166; }
  .row .line .dim { color: #9ca3af; font-size: 12px; }
  /* v7.33: BEFORE gap 8px, Done 62px, Copy min 74px; WHY room for the pill at phone width; NOW 6px, 56px, 60px, no shrinking. */
  .controls { display: flex; flex-wrap: nowrap; gap: 6px; align-items: center; }
  .controls > a, .controls > button { flex: 0 0 auto; }
  /* Raised buttons like the map popup's iPogo / GPS JoyStick buttons: colored bottom edge, press sinks 2px. */
  .controls button, .controls a { display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 6px 8px; box-sizing: border-box; border-radius: 6px; border: 1px solid #444; text-decoration: none; text-align: center; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.7); box-shadow: 0 3px 0 var(--edge, #000), 0 5px 10px rgba(0,0,0,.35); transition: transform 90ms ease, box-shadow 90ms ease, filter 90ms ease; }
  .controls button:active, .controls a:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge, #000), 0 2px 4px rgba(0,0,0,.28); filter: brightness(.93); }
  .controls .ico { display: inline-flex; width: 16px; height: 16px; flex: 0 0 16px; }
  .controls .ico svg { width: 100%; height: 100%; display: block; }
  /* v7.17: lighter face so the dark 3D edge shows against the dark page (it read as flat). */
  /* 2026-10-10 BEFORE: edges #222/#1b4d1f/#3a2e5c/#1b4425/#153f3d (and Copy GPX #3f2a80), nearly the card's colour, so
     no 3D lip showed. WHY: Bart. NOW: mid-tone edges of each button's own colour; grey Done a touch lighter, near-black edge. */
  .done-btn { background: linear-gradient(180deg, #6a6a6a, #4e4e4e); color: #fff; border-color: #7a7a7a; width: 56px; --edge: #141414; }
  .done-btn.done { background: linear-gradient(180deg, #43a047, #2e7d32); border-color: #81c784; color: #fff; --edge: #2b7330; }
  /* v7.34: teleport labels kerned 1 px tighter so the distance pill fits beside the big icon at 412 px. */
  .ipogo-btn span, .joystick-btn span { letter-spacing: -1px; }
  .ipogo-btn { background: #1f5856; color: #fff; border-color: #3f9f9a; --edge: #226d68; }
  .joystick-btn { background: #1a73e8; color: #fff; border-color: #9bc2ff; --edge: #0d47a1; }
  .maps-btn { background: #2e6b3a; color: #fff; border-color: #8fd19e; --edge: #2a6b3b; }
  .copy-btn { background: #5b4a8a; color: #fff; border-color: #b9a6f0; --edge: #4f3d8a; min-width: 60px; }
  /* 2026-10-10 BEFORE: buttons with an icon were 30px tall, text-only ones (Done, Copy) 28px; Done alone had a gradient
     body; and every class's border-color lost to '.controls button { border: 1px solid #444 }' (more specific), so no
     button showed its own outline. WHY: Bart: Done's 3D didn't match and looked shorter. NOW: one 30px height, flat
     Done, and each button's outline restored (these .controls-prefixed rules win). */
  .controls button, .controls a { height: 30px; }

  // Each row needs its own clipPath id (duplicate ids across rows would all point at the first one).
  var iconSeq = 0;
  function iconHtml(name) {
    var n = ++iconSeq;
    return '<span class="ico">' + ICONS[name].replace(/id="([^"]+)"/g, 'id="$1' + n + '"').replace(/url\(#([^)]+)\)/g, 'url(#$1' + n + ')') + '</span>';
  }
  var STORAGE_KEY = 'pokemap_quest_export_progress_v1';
  // Which teleport app and which second button the entries show (defaults: GPS JoyStick, Copy), kept per device.
  var PREFS_KEY = 'pokemap_quest_export_prefs_v1';
  var prefs = { teleport: 'joystick', second: 'copy' };
  try { var savedPrefs = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}') || {}; if (savedPrefs.teleport) prefs.teleport = savedPrefs.teleport; if (savedPrefs.second) prefs.second = savedPrefs.second; } catch (e) {}
  function setupToggle(id, key) {
    var toggle = document.getElementById(id);
    var opts = toggle.querySelectorAll('.opt');
    var sw = toggle.querySelector('.sw');
    function paint() {
      Array.prototype.forEach.call(opts, function (o) { o.classList.toggle('on', o.dataset.v === prefs[key]); });
      sw.classList.toggle('right', opts[1].dataset.v === prefs[key]);
    }
    function choose(v) {
      if (prefs[key] === v) return;
      prefs[key] = v;
      try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (err) {}
      paint(); render();
    }
    Array.prototype.forEach.call(opts, function (o) { o.addEventListener('click', function () { choose(o.dataset.v); }); });
    sw.addEventListener('click', function () { choose(prefs[key] === opts[0].dataset.v ? opts[1].dataset.v : opts[0].dataset.v); });
    paint();
  }
  // v7.33: long distances tighten their letter spacing, then shrink in half-pixel steps until they fit the pill.
  // 2026-10-10 BEFORE: every pill 68px wide (the CSS). WHY: Bart: wasted room now that distances are shorter (no decimals
  // over 100 km). NOW: all pills on the page as wide as its longest label (still equal, for symmetry), never over 68px;
  // a label that still doesn't fit is tightened and shrunk as before.
  function fitPills() {
    var pills = Array.prototype.slice.call(document.querySelectorAll('.controls .dist')), w = 0;
    pills.forEach(function (p) {
      p.style.fontSize = ''; p.style.letterSpacing = '';
      p.style.width = 'auto'; p.style.flexBasis = 'auto';
      w = Math.max(w, Math.ceil(p.getBoundingClientRect().width));
    });
    w = Math.min(68, Math.max(40, w));
    pills.forEach(function (p) { p.style.width = w + 'px'; p.style.flexBasis = w + 'px'; });
    pills.forEach(function (p) {
      var fs = 12;
