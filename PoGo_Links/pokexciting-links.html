<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokéXciting! Stamp Rally—Asia-Pacific</title>
<style>
  /* Same look as the Pokémap quest Export page (userscript), plus sections, notes and a start hint. */
  * { box-sizing: border-box; }
  /* 2026-10-28 (Bart, F27, the Joy palette as in JoyFeed): BEFORE page #2b2b29, cards #33332f, toolbar #242422 and its buttons #353533; NOW page #0b0b0a, cards #2b2b29, toolbar #2b2b29, buttons #3a3a37. Colours: Bart's VS Code palette (the early Claude code-block look): page #0b0b0a, cards #2b2b29, borders #404040,
     text #d1d5db, bold #e5e5e5, grey #9ca3af. Keep the Pokémap quest Export page and the coord-link-page template in step. */
  /* Page width. BEFORE: full window width, so on a desktop the rows stretched and the pills sat far from the rest.
     WHY: Bart wants desktops to show the phone view. NOW (2026-10-10): at most 412px wide (Pixel 6 Pro), centred; phones are
     narrower, so nothing changes there. The bottom bar is capped to match. */
  html { background: #0b0b0a; }
  body { max-width: 412px; box-sizing: border-box; margin: 0 auto; padding: 16px 16px 84px; background: #0b0b0a; color: #d1d5db; font-family: -apple-system, system-ui, sans-serif; }
  /* Title and sub line share the first line; the three header buttons get their own row (they don't fit beside the
     title at phone width). */
  /* 2026-10-11 BEFORE: h1 and .sub display:inline, so a long sub started on the title row and wrapped from there.
     WHY: Bart, "Five starts on title row, that's wrong". NOW: flex row; a sub that fits stays beside the title,
     one that doesn't moves whole to its own line (flex items don't split across lines). */
  .top { margin: 0 0 8px; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; row-gap: 2px; }
  .top h1 { margin: 0; } .top .sub { min-width: 0; }
  h1 { display: inline; font-size: 18px; margin: 0 8px 0 0; color: #e5e5e5; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 12px; } /* spans the rows' width */
  h1 .c { color: #9ca3af; font-weight: 400; font-size: 13px; }
  /* 2026-10-16 (Bart): the heading is two rows, the page name, then a live status from the page's own ticks (same words as the
     bottom bar). BEFORE: counts typed into each heading by hand ("—complete, 18 of 18"), which went stale and differed per page. */
  #headStatus { display: block; }
  .hbtn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px 6px 10px; border-radius: 999px; font-size: 13px; font-weight: 800; letter-spacing: .3px; color: #fff; cursor: pointer; text-shadow: 0 1px 2px rgba(0,0,0,.45); transition: transform 90ms ease, box-shadow 90ms ease, filter 90ms ease; }
  .hbtn svg { width: 16px; height: 16px; flex: 0 0 16px; }
  .hbtn:hover { filter: brightness(1.08); }
  .hbtn:active { transform: translateY(2px); filter: brightness(.95); }
  #copyGpxBtn { background: linear-gradient(180deg, #9b7be8, #6f4fc4); border: 1px solid #cbb8ff; box-shadow: 0 3px 0 #6448c8, 0 6px 14px rgba(111,79,196,.35); }
  #copyGpxBtn:active { box-shadow: 0 1px 0 #6448c8, 0 2px 6px rgba(111,79,196,.3); }
  #gpxBtn { background: linear-gradient(180deg, #ffb547, #f08a12); border: 1px solid #ffd08a; box-shadow: 0 3px 0 #9a5506, 0 6px 14px rgba(240,138,18,.35); }
  #gpxBtn:active { box-shadow: 0 1px 0 #9a5506, 0 2px 6px rgba(240,138,18,.3); }
  /* 2026-10-13: a long-press downloads; without this it selected the label text instead (seen on the phone). */
  #gpxBtn { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* Route-button message (2026-10-13): says whether Copy/GPX/JoyRoute/Map used the stops left or the whole route. */
  .route-hint { position: fixed; left: 0; right: 0; margin: 0 auto; width: fit-content; bottom: 130px; max-width: calc(100vw - 32px); box-sizing: border-box;
                padding: 9px 14px; border-radius: 12px; background: rgba(40,40,38,.96); border: 1px solid #555; color: #e5e5e5;
                font-size: 13px; line-height: 1.35; text-align: center; box-shadow: 0 6px 18px rgba(0,0,0,.5); z-index: 50;
                opacity: 0; pointer-events: none; transition: opacity .2s; }
  .route-hint.show { opacity: 1; }
  #mapBtn { background: linear-gradient(180deg, #2fc4b2, #138f86); border: 1px solid #8ee8dd; box-shadow: 0 3px 0 #0b5d57, 0 6px 14px rgba(19,143,134,.35); }
  #mapBtn:active { box-shadow: 0 1px 0 #0b5d57, 0 2px 6px rgba(19,143,134,.3); }
  /* Home: back to the published list (absolute URL, so it also works from Drive/Solid Explorer copies). 2026-10-10. */
  /* 2026-10-10 BEFORE: dark slate pill with a cyan border. WHY: Bart: didn't match the other buttons. NOW: a bright
     filled sky-blue pill like them (cyan would clash with Map's teal); the Home marker's house badge stays the icon. */
  #homeBtn { text-decoration: none; background: linear-gradient(180deg, #3bb8f0, #1a86c8); border: 1px solid #a8e2fb; box-shadow: 0 3px 0 #1d6aa3, 0 6px 14px rgba(26,134,200,.35); }
  #homeBtn:active { box-shadow: 0 1px 0 #1d6aa3, 0 2px 6px rgba(26,134,200,.3); }
  .sub { display: inline; color: #9ca3af; font-size: 12.5px; }
  /* 2026-10-16 (Bart) BEFORE: plain note boxes, square left corners (border-radius 0 6px 6px 0). WHY: wordy but necessary notes;
     Bart wanted them collapsible, chevron like JoyRoute's status card, all corners rounded. NOW: a note with a bold title is a
     <details> panel (build_page.py --note; open unless "closed:"); a note without a title stays a plain box. */
  .note { background: #3a3424; border-left: 3px solid #d29922; padding: 9px 11px; margin: 0 0 12px; font-size: 13px; line-height: 1.5; color: #d1d5db; border-radius: 6px; }
  .note.ok { background: #24382a; border-left-color: #3fb950; }
  details.note > summary { list-style: none; cursor: pointer; font-weight: 700; display: flex; align-items: flex-start; gap: 8px; }
  details.note > summary::-webkit-details-marker { display: none; }
  details.note > summary::after { content: ""; flex: none; margin-left: auto; margin-top: 5px; width: 7px; height: 7px; border-right: 2px solid #74aeea; border-bottom: 2px solid #74aeea; transform: rotate(-45deg); transition: transform .15s; }
  details.note[open] > summary::after { transform: rotate(45deg); margin-top: 2px; }
  details.note[open] > summary { margin-bottom: 4px; }
  .hint { font-size: 12.5px; font-weight: 600; color: #ffd166; margin: 10px 0 4px; }
  h2 { font-size: 15px; margin: 18px 0 8px; padding-bottom: 3px; border-bottom: 1px solid #404040; color: #e5e5e5; }
  h2 .c { color: #9ca3af; font-weight: 400; font-size: 12px; }
  h2.complete { opacity: .5; }
  /* Subsections (2026-10-11, the Poké Lid page's prefectures): indented 12px, a step smaller and lighter than h2, with a
     fainter rule; the rows below stay full width so their buttons keep their size. "x / N" like the game's counts. */
  h3 { font-size: 13.5px; font-weight: 600; margin: 12px 0 6px 12px; padding-bottom: 2px; border-bottom: 1px solid #383836; color: #d1d5db; }
  h3 .c { color: #9ca3af; font-weight: 400; font-size: 12px; }
  h3.complete, h3.empty { opacity: .5; }
  .toolbar { position: fixed; left: 0; right: 0; max-width: 412px; box-sizing: border-box; margin: 0 auto; bottom: 0; z-index: 10; background: #2b2b29; border-top: 1px solid #404040; padding: 7px 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .toolbar button, .toolbar label { background: #3a3a37; color: #d1d5db; border: 1px solid #404040; border-radius: 6px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
  /* 2026-10-16 (Bart) BEFORE: the whole status line grey #9ca3af at 85% opacity. WHY: the done count was too dim to read at a glance.
     NOW: the done count in the palette's text colour #d1d5db, full opacity; the "generated" time stays grey. */
  #status { order: -1; flex: 1 0 100%; display: flex; justify-content: space-between; gap: 8px; font-weight: 600; color: #9ca3af; font-size: 13px; padding-bottom: 2px; }
  #doneCount { color: #d1d5db; }
  /* Each switch in its own card like the rows (Bart), both on one row at phone width: 13px labels, 40px switches. */
  /* 2026-10-12 BEFORE: space-between (each box its natural width, an uneven gap between them) and unselected labels
     #7d7d78. WHY: Bart: the gap was awkward and the unselected text too dark. NOW: two equal halves with the toolbar's
     8px gap, contents centred, so the boxes line up edge to edge with the rows; unselected labels #d1d5db (the
     palette's text colour; #9ca3af was still too dark, Bart), the selected one bold #e5e5e5. */
  /* Each box = its contents + an equal share of the spare width (Bart: "a more equal split ... whatever matches contents"),
     BEFORE two fixed halves, which left the narrower Maps / Copy box mostly empty. */
  .switches { display: flex; gap: 8px; margin-bottom: 12px; }
  .switches .toggle { flex: 1 1 auto; }
  .toggle { display: flex; justify-content: center; align-items: center; gap: 5px; padding: 4px 6px; background: #2b2b29; border: 1px solid #404040; border-radius: 8px; user-select: none; -webkit-user-select: none; }
  /* Mirrored (Bart): the left box's contents hug its left edge, the right box's its right edge, same inset. */
  .switches .toggle:first-child { justify-content: flex-start; }
  .switches .toggle:last-child { justify-content: flex-end; }
  /* The two outer labels (iPogo, Copy) get the same fixed slot, wider than either in bold, so both switches sit exactly
     the same distance from their edges and never shift when a label turns bold (Bart: equidistant by design, not luck). */
  .switches .toggle:first-child .opt:first-child, .switches .toggle:last-child .opt:last-child { flex: 0 0 40px; }
  /* Each outer label hugs its switch inside the slot (iPogo right-aligned, Copy left-aligned), so every label is the same
     5px from its switch on both sides (Bart); BEFORE they sat at the slot's outer end, leaving a wider gap by the switch. */
  .switches .toggle:first-child .opt:first-child { text-align: right; }
  .switches .toggle:last-child .opt:last-child { text-align: left; }
  /* The inner labels (GPS JoyStick, Maps) always reserve their bold width (a hidden bold copy from data-t under the
     text), so neither box changes size when the selection changes; BEFORE the boxes' boundary moved 4px (Bart). */
  .switches .toggle:first-child .opt:last-child, .switches .toggle:last-child .opt:first-child { display: inline-grid; }
  .switches .toggle:first-child .opt:last-child::after, .switches .toggle:last-child .opt:first-child::after {
    content: attr(data-t); font-weight: 700; height: 0; visibility: hidden; overflow: hidden; }
  .switches .toggle:last-child .opt:first-child { text-align: right; }
  .toggle .opt { font-size: 13px; color: #d1d5db; cursor: pointer; font-weight: 400; }
  .toggle .opt.on { color: #e5e5e5; font-weight: 700; }
  .toggle .sw { position: relative; width: 40px; height: 24px; border: 2px solid #d1d5db; border-radius: 13px; background: #0b0b0a; cursor: pointer; padding: 0; flex: 0 0 auto; }
  .toggle .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #d1d5db; transition: transform 140ms ease; }
  .toggle .sw.right::after { transform: translateX(16px); }
  /* Two lines per stop: one sideways-scrolling info line, then the buttons. The icon column only exists when
     some stop has an icon (body.icons). */
  .row { background: #2b2b29; border: 1px solid #404040; border-radius: 8px; padding: 6px 8px; margin-bottom: 6px; display: grid; grid-template-columns: minmax(0, 1fr); row-gap: 5px; align-items: center; }
  /* Picture column. BEFORE: 44px column, 38px tall, 8px left padding and gap. WHY: the distance pill moved onto the
     button row and needs the room; Bart wanted bigger pictures. NOW (2026-10-09, same as Pokémap 7.34): 52x56, left
     padding 3px, gap 5px, teleport labels kerned 1px tighter; fits from 412px wide (narrower phones scroll). */
  body.icons .row { grid-template-columns: 52px minmax(0, 1fr); column-gap: 5px; padding-left: 3px; }
  body.icons .ipogo-btn span, body.icons .joystick-btn span { letter-spacing: -1px; }
  .row.done { opacity: 0.45; }
  .row.tba { opacity: 0.55; border-style: dashed; }
  .row.tba .controls > * { filter: grayscale(1); pointer-events: none; box-shadow: none; }
  .row .qicon { grid-row: 1 / span 2; width: 52px; height: 56px; object-fit: contain; }
  .row .noicon { grid-row: 1 / span 2; }
  .row .line { white-space: nowrap; overflow-x: auto; scrollbar-width: none; font-size: 14px; color: #d1d5db; }
  .row .line::-webkit-scrollbar { display: none; }
  .row .line b { color: #e5e5e5; font-size: 15px; }
  .row .line .task { color: #e5e5e5; font-size: 15px; }
  /* Distance pill. BEFORE: at the start of line 1, as wide as its text, so names started at random positions. WHY: Bart
     didn't like the uneven sizing. NOW (2026-10-09): at the right end of the button row, one fixed width; long text is
     tightened and shrunk to fit (fitPills in the script). The location pill ("from here") is cyan like the Default badge. */
  .row .controls .dist { flex: 0 0 68px; width: 68px; box-sizing: border-box; margin-left: auto; padding: 0 3px; text-align: center; white-space: nowrap; overflow: hidden; background: #0b0b0a; border: 1px solid #4a4a46; border-radius: 10px; font-size: 12px; line-height: 20px; font-weight: 700; color: #ffd166; }
  .row .controls .dist.here { border-color: #26c6da; color: #26c6da; }
  /* 2026-10-16 (Bart): a flagged row (data p.flag, points.json "flag": true, e.g. a moved pin) gets a red distance pill so it stands out. */
  .row .controls .dist.flag { border-color: #ff7b72; color: #ff7b72; }
  .row .line .dim { color: #9ca3af; font-size: 12px; }
  .row .line2 { font-size: 12.5px; line-height: 1.4; color: #9ca3af; white-space: normal; margin: 1px 0 4px; }
  /* BEFORE gap 8px, Done 62px, Copy min 74px. WHY: room for the pill on this row at phone width. NOW (2026-10-09): 6px gap,
     Done 56px (still fits "✓ Done"), Copy 60px, buttons don't shrink. Measured at 375px: exactly fits. */
  .controls { display: flex; flex-wrap: nowrap; gap: 6px; align-items: center; }
  .controls > a, .controls > button { flex: 0 0 auto; }
  .controls button, .controls a { display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 6px 8px; box-sizing: border-box; border-radius: 6px; border: 1px solid #444; text-decoration: none; text-align: center; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.7); box-shadow: 0 3px 0 var(--edge, #000), 0 5px 10px rgba(0,0,0,.35); transition: transform 90ms ease, box-shadow 90ms ease, filter 90ms ease; }
  .controls button:active, .controls a:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge, #000), 0 2px 4px rgba(0,0,0,.28); filter: brightness(.93); }
  .controls .ico { display: inline-flex; width: 16px; height: 16px; flex: 0 0 16px; }
  .controls .ico svg { width: 100%; height: 100%; display: block; }
  /* 2026-10-10 BEFORE: edges #222/#1b4d1f/#3a2e5c/#1b4425/#153f3d (and Copy GPX #3f2a80), nearly the card's colour, so
     no 3D lip showed. WHY: Bart. NOW: mid-tone edges of each button's own colour; grey Done a touch lighter, near-black edge. */
  .done-btn { background: linear-gradient(180deg, #6a6a6a, #4e4e4e); color: #fff; border-color: #7a7a7a; width: 56px; --edge: #141414; }
  .done-btn.done { background: linear-gradient(180deg, #43a047, #2e7d32); border-color: #81c784; color: #fff; --edge: #2b7330; }
  .ipogo-btn { background: #1f5856; color: #fff; border-color: #3f9f9a; --edge: #226d68; }
  .joystick-btn { background: #1a73e8; color: #fff; border-color: #9bc2ff; --edge: #0d47a1; }
  .maps-btn { background: #2e6b3a; color: #fff; border-color: #8fd19e; --edge: #2a6b3b; }
  .copy-btn { background: #5b4a8a; color: #fff; border-color: #b9a6f0; --edge: #4f3d8a; min-width: 60px; }
  /* 2026-10-10 BEFORE: buttons with an icon were 30px tall, text-only ones (Done, Copy) 28px; Done alone had a gradient
     body; and every class's border-color lost to `.controls button { border: 1px solid #444 }` (more specific), so no
     button showed its own outline. WHY: Bart: Done's 3D didn't match and looked shorter. NOW: one 30px height, flat
     Done, and each button's outline restored (these .controls-prefixed rules win). */
  .controls button, .controls a { height: 30px; }
  /* 2026-10-10 BEFORE: #5e5e5e with edge #2a2a2a, darker than the card (#33332f), so no lip showed. WHY: Bart.
     NOW: option B of three he was shown: #787878, edge #525252, outline #b0b0b0. */
  .controls .done-btn { background: #787878; border-color: #b0b0b0; --edge: #525252; }
  .controls .done-btn.done { background: #2e7d32; border-color: #81c784; --edge: #1f5a22; }
  .controls .ipogo-btn { border-color: #3f9f9a; } .controls .joystick-btn { border-color: #9bc2ff; }
  .controls .maps-btn { border-color: #8fd19e; } .controls .copy-btn { border-color: #b9a6f0; }
  /* Export / Import progress always on their own second row (Bart). */
  .toolbar .brk { flex-basis: 100%; height: 0; }
  /* 2026-10-10 BEFORE: toolbar buttons at their natural widths, rows ragged. WHY: Mark all and Home were added (Bart)
     and his symmetry rule. NOW: toolbar buttons share each row equally (Hide done · Undo last · Mark all · Reset all,
     then Export · Import); header labels never wrap (Home · Copy GPX · GPX · Map fit one line at 412 px; 2026-10-13: Home · Copy · JoyRoute · Map, 10 px gaps). */
  .hbtn { white-space: nowrap; }
  .toolbar button, .toolbar label { flex: 1 1 0; min-width: 0; padding: 6px 4px; text-align: center; white-space: nowrap; }
  .toolbar { row-gap: 4px; } /* the break is an empty flex line, so the rows' gap counts twice around it */
  /* The [Bart]manEH mark between Export and Import (Bart, 2026-10-12), drawn like his logo: Bart about 2.4x the height of
     "manEH"'s capitals, the gap about half a capital; it links to the PoGO Link Pages list. The two buttons keep sharing the rest. */
  .toolbar .mark { flex: 0 0 auto; display: flex; align-items: center; text-decoration: none; color: #9ca3af; font-size: 13px; font-weight: 600; }
  .toolbar .mark img { height: 22px; width: auto; display: block; }
  .toolbar .mark span { margin-left: 4px; padding-top: 2px; }
  #importInput { display: none; }
</style>
</head>
<body>
<div class="top"><h1>PokéXciting! Stamp Rally—Asia-Pacific<span class="hs" id="headStatus"></span></h1><div class="sub">5 city stamps · 12 Sep 2026–11 Sep 2029 · each: Pikachu in its country&rsquo;s wig colour + local Location Background</div></div>
<div class="head"><a id="homeBtn" class="hbtn" href="https://bartmaneh.github.io/PoGo_Links/" title="Back to the PoGO Link Pages list"><svg viewBox="8 8 48 48" aria-hidden="true"><circle cx="32" cy="32" r="22" fill="#263238" stroke="#26c6da" stroke-width="5"/><path d="M19 32.5 32 21l13 11.5-3.4 3L40 34.1V45H34v-8h-4v8h-6V34.1l-1.6 1.4z" fill="#fff" stroke="#fff" stroke-linejoin="round"/></svg>Home</a><button id="copyGpxBtn" class="hbtn" title="Copy the route's GPX text (to paste into iPogo)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg><span>Copy</span></button><button id="gpxBtn" class="hbtn" title="Download the route as a GPX file (iPogo, GPS JoyStick)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/></svg>GPX</button><button id="mapBtn" class="hbtn" title="Open the route in the GPX viewer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14"/><path d="M15 6v14"/></svg>Map</button></div>
<div class="note ok">All four announced pins verified on the ground. Bangkok is still unannounced by Scopely.</div>
<div class="switches">
  <div class="toggle" id="teleportToggle"><span class="opt" data-v="ipogo">iPogo</span><button class="sw" aria-label="iPogo or GPS JoyStick"></button><span class="opt" data-v="joystick" data-t="GPS JoyStick">GPS JoyStick</span></div>
  <div class="toggle" id="secondToggle"><span class="opt" data-v="maps" data-t="Maps">Maps</span><button class="sw" aria-label="Maps or Copy"></button><span class="opt" data-v="copy">Copy</span></div>
</div>
<div class="toolbar">
  <button id="hideDoneBtn">Hide done</button>
  <button id="undoBtn">Undo last</button>
  <button id="markAllBtn" title="Mark every stop done">Mark all</button>
  <button id="resetAllBtn">Reset all</button>

  var HOP_BASE = 'http://127.0.0.1:48730';
  // BEFORE: one token per site (key 'joyroute_hop_token'). WHY: two pages of one site then shared a token and JoyRoute's server, which finds
  // the HopRoute by token, could answer one page with the other's card (Bart, 2026-10-15). NOW: one token per page, keyed by this page's storage
  // key (the PoGo Links list page reads the same key to show live counts).
  var HOP_TOKEN_KEY = 'joyroute_hop_token:' + D.storageKey, HOP_LINKED_KEY = D.storageKey + ':hopLinked', HOP_TRY_KEY = D.storageKey + ':hopTry';
  // Two-way sync (2026-10-15, Bart). BEFORE: ticks were only ever added, both ways, and ticks made here before the link existed never
  // reached JoyRoute. WHY: Bart ticks rows here first (GPS JoyStick links) and starts a HopRoute later, and un-ticks were never
  // shared. NOW: per stop the NEWEST change (tick or un-tick, from either side) wins. A tick's time is its ts in state; an un-tick's
  // time is kept in HOP_GONE_KEY ({key: ms}). On connecting the page sends its whole state (POST /sync) and takes JoyRoute's merged
  // answer; after that every change goes both ways as it happens (POST /marks here; add/remove events from JoyRoute).
  var HOP_GONE_KEY = D.storageKey + ':hopGone';
  var hopToken = '', hopLinked = false, hopTry = 0, hopSource = null, hopFails = 0, hopGone = {};
  var HOP_KEY_BY_COORD = {};
  function hopCoordOf(p) { return Number(p.lat).toFixed(6) + ',' + Number(p.lon).toFixed(6); }
  POINTS.forEach(function (p) { if (!p.tba && p.lat != null && p.lon != null) HOP_KEY_BY_COORD[hopCoordOf(p)] = p.key; });
  try {
    hopToken = localStorage.getItem(HOP_TOKEN_KEY) || '';
    if (!hopToken && window.crypto && crypto.getRandomValues) {
      var rnd = new Uint8Array(16);
      crypto.getRandomValues(rnd);
      hopToken = Array.prototype.map.call(rnd, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
      localStorage.setItem(HOP_TOKEN_KEY, hopToken);
    }
    hopLinked = localStorage.getItem(HOP_LINKED_KEY) === '1';
    hopTry = Number(localStorage.getItem(HOP_TRY_KEY)) || 0;
    hopGone = JSON.parse(localStorage.getItem(HOP_GONE_KEY) || '{}') || {};
  } catch { /* ignore: not available in this browser */ }
  function hopSaveGone() {
    try { if (Object.keys(hopGone).length) localStorage.setItem(HOP_GONE_KEY, JSON.stringify(hopGone)); else localStorage.removeItem(HOP_GONE_KEY); } catch { /* ignore */ }
  }
  function hopPost(path, marks) {
    // text/plain: the body is JSON, but a "simple" type keeps the request free of an extra CORS header check.
    return fetch(HOP_BASE + path + '?token=' + hopToken, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ marks: marks }) })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  // A change made here, for the stops [keys] (now done or not): remember un-tick times, and tell JoyRoute if a HopRoute from this
  // page exists (if JoyRoute can't be reached now, the sync on the next connect carries it). Failures are ignored.
  function hopChanged(keys, done) {
    if (!GPX_TO_JOYROUTE || !keys.length) return;
    var now = Date.now(), marks = [];
    keys.forEach(function (k) {
      var p = BY_KEY[k];
      if (done) delete hopGone[k]; else hopGone[k] = now;
      if (p && !p.tba && p.lat != null) marks.push([hopCoordOf(p), done ? 1 : 0, done ? ((state[k] && +state[k].ts) || 0) : now]);
    });
    hopSaveGone();
    if (hopLinked && hopToken && marks.length) hopPost('/marks', marks).catch(function () {});
  }
  // A change from JoyRoute for the stop at coordinates c: taken only if newer than what this page has (a tie goes to the tick,
  // the same rule as JoyRoute's). Returns the stop's key if anything changed.
  function hopApply(c, done, ts) {
    var k = HOP_KEY_BY_COORD[c];
    if (!k) return null;
    var on = !!state[k], mine = on ? (+state[k].ts || 0) : (hopGone[k] != null ? hopGone[k] : -1);
    if (ts < mine || (ts === mine && (on || !done))) return null;
    if (done) { state[k] = { done: true, ts: ts }; delete hopGone[k]; } else { delete state[k]; hopGone[k] = ts; }
    return k;
  }
  function hopApplied(keys) {
    if (!keys.length) return;
    save(); hopSaveGone();
    if (keys.length > 3) render(); else keys.forEach(updateRow);
  }
  // On connecting: send everything this page knows, take JoyRoute's merged marks. An older JoyRoute without /sync: fall back to
  // adding the ticks its state event listed (the behaviour before 2026-10-15).
  function hopSync(stateDone) {
    var marks = [];
    POINTS.forEach(function (p) {
      if (p.tba || p.lat == null) return;
      if (state[p.key]) marks.push([hopCoordOf(p), 1, +state[p.key].ts || 0]);
      else if (hopGone[p.key] != null) marks.push([hopCoordOf(p), 0, hopGone[p.key]]);
    });
    hopPost('/sync', marks).then(function (r) {
      var changed = [];
      (r.marks || []).forEach(function (m) { var k = hopApply(m[0], !!m[1], +m[2] || 0); if (k) changed.push(k); });
      hopApplied(changed);
    }).catch(function () {
      var changed = [], now = Date.now();
      (stateDone || []).forEach(function (c) { var k = hopApply(c, true, now); if (k) changed.push(k); });
      hopApplied(changed);
    });
  }
  // The JoyRoute button's icon shows the link: normal (no HopRoute from this page yet), bright with a ring (live), grey
  // (a HopRoute from this page exists but JoyRoute can't be reached right now).
  var hopStyle = document.createElement('style');
  hopStyle.textContent = '#gpxBtn.jr-live svg{border-radius:50%;box-shadow:0 0 0 2px #a5d6a7;filter:brightness(1.35) saturate(1.2)}' +
    '#gpxBtn.jr-off svg{filter:grayscale(1) opacity(.55)}';
  document.head.appendChild(hopStyle);
  function hopIcon(mode) {
    gpxBtn.classList.toggle('jr-live', mode === 'live');
    gpxBtn.classList.toggle('jr-off', mode === 'off');
    if (!GPX_TO_JOYROUTE) return;
    gpxBtn.title = mode === 'live' ? 'JoyRoute is connected: ticks are shared both ways'
      : mode === 'off' ? 'A HopRoute from this page exists but JoyRoute is not reachable: open JoyRoute (HopRoute tab)'
      : 'Open the route in JoyRoute (adds it to GPS JoyStick, or starts a HopRoute); long-press: download the GPX file';
  }
  function hopWanted() { return hopLinked || (Date.now() - hopTry < 600000); }
  function hopConnect() {
    if (!GPX_TO_JOYROUTE || !hopToken || !hopWanted() || hopSource || !window.EventSource) return;
    var src = new EventSource(HOP_BASE + '/events?token=' + hopToken);
    hopSource = src;
    src.onopen = function () {
      hopFails = 0;
      hopIcon('live');
      if (!hopLinked) { hopLinked = true; try { localStorage.setItem(HOP_LINKED_KEY, '1'); } catch { /* ignore */ } }
    };
    src.onmessage = function (ev) {
      var m;
      try { m = JSON.parse(ev.data); } catch { return; }
      if (!m) return;
      if (m.type === 'state') { hopSync(m.done); return; }
      var coords = m.type === 'add' ? m.at : m.type === 'remove' ? m.gone : null;
      if (!coords) return;
      var changed = [], now = Date.now();
      coords.forEach(function (c, i) { var k = hopApply(c, m.type === 'add', m.ts ? +m.ts[i] : now); if (k) changed.push(k); });
      hopApplied(changed);
    };
    src.onerror = function () {
      if (hopLinked) hopIcon('off');
      // EventSource retries by itself; give up after a few failures and try again when the page is shown again.
      if (++hopFails >= 3) { src.close(); hopSource = null; }
    };
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { hopFails = 0; hopConnect(); }
  });
  if (hopLinked) hopIcon('off');
  hopConnect();
  function downloadGpx() { download(routeGpx(D.gpx), 'application/gpx+xml', GPX_NAME); routeHint('Downloaded'); }
  if (GPX_TO_JOYROUTE) {
    gpxBtn.innerHTML = JOYROUTE_ICON + 'JoyRoute';
    gpxBtn.title = 'Open the route in JoyRoute (adds it to GPS JoyStick); long-press: download the GPX file';
  }
  var copyIcon = document.querySelector('#copyGpxBtn svg');
  if (copyIcon && ICONS.ipogo) copyIcon.outerHTML = ICONS.ipogo;
  var gpxPressTimer = 0, gpxLongPress = false, gpxIgnoreClickUntil = 0;
  gpxBtn.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse') return;
    gpxLongPress = false;
    clearTimeout(gpxPressTimer);
    gpxPressTimer = setTimeout(function () { gpxLongPress = true; }, 500);
  });
  gpxBtn.addEventListener('pointerup', function (e) {
    clearTimeout(gpxPressTimer);
    if (e.pointerType === 'mouse' || !gpxLongPress) return;
    gpxLongPress = false;
    gpxIgnoreClickUntil = Date.now() + 800;
    downloadGpx();
  });
  gpxBtn.addEventListener('pointercancel', function () { clearTimeout(gpxPressTimer); gpxLongPress = false; });
  gpxBtn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  gpxBtn.addEventListener('click', function (e) {
    if (Date.now() < gpxIgnoreClickUntil) return;
    if (!GPX_TO_JOYROUTE || e.shiftKey) { downloadGpx(); return; }
    routeHint('Sent', 'to JoyRoute');
    // Also this page's address, origin and token, so a HopRoute made from this link can talk to the page; and from now on
    // (10 minutes) the page looks for JoyRoute's server when it is shown again.
    var hopParams = '';
    if (hopToken) {
      hopParams = '&page=' + encodeURIComponent(location.href.split('#')[0]) + '&origin=' + encodeURIComponent(location.origin) + '&token=' + hopToken;
      hopTry = Date.now();
      try { localStorage.setItem(HOP_TRY_KEY, String(hopTry)); } catch { /* ignore */ }
    }
    location.href = 'joyroute://import?name=' + encodeURIComponent(GPX_NAME) + '&gpx=' + encodeURIComponent(routeGpx(D.gpx)) + hopParams;
  });
  var copyGpxBtn = document.getElementById('copyGpxBtn');
  copyGpxBtn.addEventListener('click', function () {
    var lbl = copyGpxBtn.querySelector('span');
    copyText(routeGpx(D.gpx)).then(function () {
      routeHint('Copied');
      lbl.textContent = '\u2713 Copied';
      copyGpxBtn.title = 'GPX copied: paste it into iPogo';
      setTimeout(function () { lbl.textContent = 'Copy'; }, 2500);
    });
  });
  document.getElementById('mapBtn').addEventListener('click', function () {
    routeHint('Showing', 'on the map');
    window.open(D.viewerUrl + '#gpx=' + encodeURIComponent(routeGpx(D.gpx)), '_blank');
  });
  render();
  // Location only when already allowed (no prompt on load); "start" pills ask when tapped. Re-read it when you come
  // back to the page (e.g. after a teleport), so "here" follows you.
  try {
    if (navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name: 'geolocation' }).then(function (s) { if (s.state === 'granted') locate(false); }, function () {});
    }
  } catch { /* ignore: not available in this browser */ }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && HERE) locate(false); });
})();
// 2026-10-11 BEFORE: body padding-bottom fixed at 84px. WHY: the toolbar grew to three lines (~102px, Export/Import row)
// and hid the last stop behind it (Bart, PokéXciting page). NOW: the padding follows the toolbar's real height.
(function () { var t = document.querySelector('.toolbar'); if (!t) return;
  function fit() { document.body.style.paddingBottom = (t.offsetHeight + 12) + 'px'; }
  fit(); window.addEventListener('resize', fit); if (window.ResizeObserver) new ResizeObserver(fit).observe(t); })();
</script>
</body>
